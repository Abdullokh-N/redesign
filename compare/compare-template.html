<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сравнение редизайна САКП</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4f6; --panel:#fff; --ink:#1a2736; --muted:#5d6876; --line:#e2e5ea; --soft:#eef0f3;
  --p:#c8241c; --p-bg:#fdecea; --c:#a85d06; --c-bg:#fdf1dc; --i:#2457c5; --i-bg:#e8effd; --ok:#177a3c; --ok-bg:#e6f5ec;
  --brand:#9b2226;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
button,input{font:inherit;color:inherit}
code{font:12px/1.3 ui-monospace,Consolas,monospace;background:var(--soft);padding:1px 5px;border-radius:4px}
#app{display:grid;grid-template-columns:300px minmax(0,1fr);height:100vh}

/* ── боковая панель ── */
#side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-head{padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.side-head h1{font-size:15px;line-height:1.25;margin:0 0 4px;font-weight:800}
.side-head h1 span{color:var(--brand)}
.side-head a{display:inline-block;margin-top:6px;font-size:13px;color:var(--i);text-decoration:none;font-weight:600;cursor:pointer}
.filters{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px 8px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip:hover{border-color:#c5cad2}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip i{font-style:normal;opacity:.7;font-variant-numeric:tabular-nums}
.search{margin:4px 16px 10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;width:calc(100% - 32px)}
#list{overflow:auto;padding:0 8px 24px;flex:1}
.grp{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:14px 8px 4px}
.it{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:6px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:8px;cursor:pointer}
.it:hover{background:var(--soft)}
.it[aria-current="true"]{background:var(--ink);color:#fff}
.it .n{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted);font-size:12px}
.it[aria-current="true"] .n{color:#b9c3cf}
.it .t{font-size:13px;line-height:1.3}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:10px;font-size:11px;font-weight:700;padding:0 6px;font-variant-numeric:tabular-nums}
.b-p{background:var(--p);color:#fff}.b-c{background:var(--c-bg);color:var(--c)}.b-ok{background:var(--ok-bg);color:var(--ok)}

/* ── основная область ── */
#main{overflow:auto;min-width:0;position:relative}
.wrap{max-width:1320px;margin:0 auto;padding:24px 28px 64px}
#loading{position:fixed;inset:0;background:var(--bg);z-index:50;display:grid;place-items:center;text-align:center;color:var(--muted)}
#loading b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}

/* сводка */
#summary h2{font-size:26px;font-weight:800;margin:0 0 6px;letter-spacing:-.01em}
#summary h3{font-size:17px;font-weight:800;margin:32px 0 10px}
.lead{color:var(--muted);margin:0 0 18px;max-width:900px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0 8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;text-align:left}
.stat:hover{border-color:#c5cad2}
.stat b{display:block;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{color:var(--muted);font-size:13px}
.stat.p b{color:var(--p)}.stat.c b{color:var(--c)}.stat.ok b{color:var(--ok)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.checks{list-style:none;margin:0;padding:0}
.checks li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:7px 0;border-bottom:1px solid var(--soft)}
.checks li:last-child{border-bottom:0}
.ok-i{color:var(--ok);font-weight:800}.bad-i{color:var(--p);font-weight:800}.warn-i{color:var(--c);font-weight:800}
.type{border-left:4px solid var(--line)}
.type.sev-problem{border-left-color:var(--p)}.type.sev-check{border-left-color:#e2a03a}.type.sev-info{border-left-color:var(--i)}
.type h4{margin:0 0 4px;font-size:15px}
.type p{margin:0 0 10px;color:var(--muted)}
.sc-links{display:flex;flex-wrap:wrap;gap:6px}
.sc-link{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:4px 9px;font-size:12px;cursor:pointer;text-align:left}
.sc-link:hover{border-color:var(--ink)}
.sc-link b{font-variant-numeric:tabular-nums}
table.map{border-collapse:collapse;width:100%;font-size:13px}
table.map td{padding:6px 8px;border-bottom:1px solid var(--soft);vertical-align:middle}
table.map td:first-child{width:44px;font-size:18px;text-align:center}

/* экран */
.scr-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.crumbs{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.scr-head h2{font-size:22px;line-height:1.25;font-weight:800;margin:4px 0 4px}
.scr-head h2 .num{color:var(--brand);font-variant-numeric:tabular-nums;margin-right:8px}
.scr-head .rid{color:var(--muted);font-size:13px}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:13px}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.scr-body{display:grid;grid-template-columns:auto auto minmax(300px,1fr);gap:20px;align-items:start}
figure{margin:0}
figcaption{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:22px}
figcaption label{text-transform:none;letter-spacing:0;font-weight:600;display:inline-flex;gap:6px;align-items:center;cursor:pointer;color:var(--ink)}
.fwrap{background:#dfe3e8;border-radius:22px;padding:10px}
iframe.fr{display:block;border:0;width:328px;height:600px;background:transparent}
iframe.fr.analyzing{position:fixed;left:0;top:0;width:1600px;height:1400px;opacity:0;pointer-events:none}
.diffs{min-width:0}
.dsec{margin:0 0 16px}
.dsec > h3{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;margin:0 0 8px;display:flex;gap:8px;align-items:center}
.dsec.sev-problem > h3{color:var(--p)}.dsec.sev-check > h3{color:var(--c)}.dsec.sev-info > h3{color:var(--i)}
.d{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.d .mk{width:24px;height:24px;border-radius:12px;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;background:var(--muted)}
.sev-problem .d .mk{background:var(--p)}.sev-check .d .mk{background:#d48410}.sev-info .d .mk{background:var(--i)}
.d .mk.none{background:transparent;border:2px solid var(--line)}
.d:hover{border-color:#c5cad2}
.dt{font-weight:700;margin-bottom:3px}
.dd{color:var(--muted);font-size:13px}
.dd .q{color:var(--ink)}
.cut{background:var(--p-bg);color:var(--p);text-decoration:line-through;text-decoration-thickness:1px;border-radius:3px}
.ba{display:grid;grid-template-columns:52px minmax(0,1fr);gap:2px 8px;margin-top:6px;font-size:13px}
.ba > span:nth-child(odd){color:var(--muted);font-size:12px;padding-top:1px}
.ba > span:nth-child(even){color:var(--ink)}
.empty{background:var(--ok-bg);color:var(--ok);border-radius:12px;padding:12px 14px;font-weight:600}
.g{font-size:16px;line-height:1}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
.dotx{display:inline-block;width:10px;height:10px;border-radius:50%;background:#8a8c8a;vertical-align:0}
.dotx.ok{background:#1f9d55}.dotx.bad{background:#d12b22}.dotx.warn{background:#d9910b}.dotx.info{background:#2f6fb0}
.reps{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
.rep{display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px}
.rep .arr{color:var(--muted)}
.rep .cnt{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:0 0 14px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:14px;height:14px;border-radius:4px;border:2px solid;display:inline-block}
.warnbox{background:var(--c-bg);color:#6b3d03;border-radius:12px;padding:10px 14px;margin:12px 0;font-size:13px}
[hidden]{display:none!important}

@media (max-width:1180px){ .scr-body{grid-template-columns:auto auto} .diffs{grid-column:1 / -1} }
@media (max-width:900px){
  #app{grid-template-columns:1fr;height:auto}
  #side{max-height:46vh;border-right:0;border-bottom:1px solid var(--line)}
  #main{overflow:visible}
  .wrap{padding:16px}
  .scr-body{grid-template-columns:1fr} .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>
<body>
<div id="loading"><div><b>Сравниваю 92 экрана…</b>Оба борда загружаются и сверяются прямо в браузере, это занимает несколько секунд.</div></div>
<div id="app">
  <aside id="side">
    <div class="side-head">
      <h1>Сравнение редизайна <span>САКП</span></h1>
      <a id="to-summary">← Сводка различий</a>
    </div>
    <div class="filters" id="filters"></div>
    <input class="search" id="q" type="search" placeholder="Поиск по номеру или названию">
    <nav id="list" aria-label="Экраны"></nav>
  </aside>
  <main id="main">
    <div class="wrap">
      <section id="summary" hidden></section>
      <section id="screen">
        <div class="scr-head">
          <div>
            <div class="crumbs" id="s-sec"></div>
            <h2><span class="num" id="s-num"></span><span id="s-name"></span></h2>
            <div class="rid">код экрана <code id="s-rid"></code> · <span id="s-of"></span></div>
          </div>
          <div class="nav">
            <button class="btn" id="prev">← Предыдущий</button>
            <button class="btn" id="next">Следующий →</button>
          </div>
        </div>
        <div class="legend"><span><i style="border-color:#d12b22"></i>красная рамка — проблема</span><span><i style="border-color:#d97706"></i>жёлтая — проверить</span><span>номер на рамке = номер пункта в списке справа · стрелки ← → листают экраны</span></div>
        <div class="scr-body">
          <figure><figcaption>Было · оригинал</figcaption><div class="fwrap"><iframe class="fr analyzing" id="frameO" title="Оригинал"></iframe></div></figure>
          <figure><figcaption>Стало · редизайн <label><input type="checkbox" id="dark"> тёмная тема</label></figcaption><div class="fwrap"><iframe class="fr analyzing" id="frameR" title="Редизайн"></iframe></div></figure>
          <div class="diffs" id="diffs"></div>
        </div>
      </section>
    </div>
  </main>
</div>

<script>
const ORIG_HTML = /*__ORIG__*/"";
const RED_HTML = /*__RED__*/"";
</script>
<script>
(async () => {
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(9)) { if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return e;
}

// ── нормализация ──────────────────────────────────────────────────────────────
const GL = /[\u{1F1E6}-\u{1F1FF}]{2}|\p{Extended_Pictographic}(?:️)?(?:‍\p{Extended_Pictographic}(?:️)?)*|[\p{So}›＋]/gu;
const STRIP = /[\p{So}\p{Extended_Pictographic}‍️⃣›＋]/gu;
const txtNorm = (s) => (s || '').replace(STRIP, ' ').replace(/(^|\s)\?(?=\s|$)/g, ' ').replace(/\s+/g, ' ').trim();
const keyNorm = (s) => (s || '').replace(STRIP, '').replace(/[?\s]/g, '');
const short = (s, n = 70) => { s = txtNorm(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; };

const lcs = (a, b) => {
  const n = a.length, m = b.length, dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const ops = []; let i = 0, j = 0;
  while (i < n && j < m) { if (a[i] === b[j]) { ops.push(['=', a[i]]); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) ops.push(['-', a[i++]]); else ops.push(['+', b[j++]]); }
  while (i < n) ops.push(['-', a[i++]]); while (j < m) ops.push(['+', b[j++]]);
  const hunks = []; let cur = null;
  ops.forEach((o, k) => { if (o[0] === '=') { cur = null; return; } if (!cur) { cur = { del: [], add: [], ctx: ops.slice(Math.max(0, k - 5), k).filter((x) => x[0] !== '+').map((x) => x[1]).join(' ') }; hunks.push(cur); } (o[0] === '-' ? cur.del : cur.add).push(o[1]); });
  return hunks;
};
const msDiff = (a, b) => {
  const c = new Map(); a.forEach((x) => c.set(x, (c.get(x) || 0) + 1)); b.forEach((x) => c.set(x, (c.get(x) || 0) - 1));
  const rem = [], add = []; for (const [k, v] of c) { for (let i = 0; i < v; i++) rem.push(k); for (let i = 0; i < -v; i++) add.push(k); }
  return { rem, add };
};

// ── загрузка бордов ───────────────────────────────────────────────────────────
const fO = $('#frameO'), fR = $('#frameR');
const load = (f, html) => new Promise((res) => { f.addEventListener('load', () => res(f.contentDocument), { once: true }); f.srcdoc = html; });
const [dO, dR] = await Promise.all([load(fO, ORIG_HTML), load(fR, RED_HTML)]);
try { await Promise.race([dR.fonts.ready, sleep(8000)]); } catch (e) {}
await sleep(500);
const FONT_OK = (() => { try { return dR.fonts.check('600 14px Inter'); } catch (e) { return true; } })();

// спрайт иконок редизайна — в эту страницу, чтобы показывать настоящие иконки
const sprite = dR.body.querySelector(':scope > svg');
if (sprite) { const c = document.importNode(sprite, true); c.setAttribute('aria-hidden', 'true'); c.style.cssText = 'position:absolute;width:0;height:0;overflow:hidden'; document.body.prepend(c); }
const icon = (id) => { const ns = 'http://www.w3.org/2000/svg'; const s = document.createElementNS(ns, 'svg'); s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('class', 'ic'); const u = document.createElementNS(ns, 'use'); u.setAttribute('href', '#' + id); s.appendChild(u); return s; };
const glyph = (g) => h('span', { class: 'g' }, g);
const markView = (m) => m.kind === 'icon' ? h('span', { title: m.m }, icon(m.m)) : m.kind === 'dot' ? h('span', { class: 'dotx ' + (m.tone || ''), title: 'CSS-точка' }) : glyph(m.m);

// ── сравнение ─────────────────────────────────────────────────────────────────
const TYPES = {
  text:          { sev: 'problem', title: 'Изменён текст', why: 'Слова или числа экрана отличаются от оригинала.' },
  ctrl:          { sev: 'problem', title: 'Изменены кнопки или поля', why: 'Отличается состав элементов управления или их подсказки, значения, состояния.' },
  'hidden-text': { sev: 'problem', title: 'Текст скрыт стилями', why: 'Текст есть в разметке, но в редизайне его не видно.' },
  'hidden-ctrl': { sev: 'problem', title: 'Кнопка или поле стали невидимыми', why: '' },
  trunc:         { sev: 'problem', title: 'Строка обрезана многоточием — скрыто больше четверти', why: 'В оригинале строка видна целиком. По правилу из DESIGN-NOTES.md усечение больше 25% — это уже не усечение, а потеря данных.' },
  'option-emoji':{ sev: 'problem', title: 'Из пунктов выпадающего списка удалены значки', why: 'Правило 7 в DESIGN-NOTES.md: содержимое <option> не трогаем. Иконку внутрь пункта списка вставить нельзя, поэтому значок просто пропал.' },
  zwj:           { sev: 'check', title: 'Составное эмодзи разбито на несколько иконок', why: 'Эмодзи из нескольких частей, склеенных невидимым символом U+200D, заменили по частям: вышли две иконки подряд, а невидимая «склейка» осталась в тексте. На Windows оригинал тоже рисуется двумя картинками, так что на глаз разница мала, но по правилу «один смысл — одна иконка» здесь нужна одна.' },
  orphan:        { sev: 'problem', title: 'В тексте остался невидимый служебный символ', why: 'Обломок эмодзи (U+200D или U+FE0F) без самого эмодзи.' },
  'trunc-minor': { sev: 'check', title: 'Строка слегка обрезана многоточием', why: 'Скрыт небольшой хвост строки (меньше четверти).' },
  overload:      { sev: 'check', title: 'Одна иконка на разных по смыслу местах', why: 'На одном экране одной иконкой обозначены разные вещи — это против правила «один смысл — одна иконка».' },
  kept:          { sev: 'check', title: 'Символ остался текстом, хотя в других местах стал иконкой', why: 'Непоследовательно: тот же символ на остальных экранах заменён SVG-иконкой.' },
  removed:       { sev: 'check', title: 'Значок убран без замены', why: 'Смысл передаёт текст, но значок исчез. Возможно, так задумано (в референсе кнопки без иконок).' },
  added:         { sev: 'check', title: 'Добавлен значок, которого не было в оригинале', why: '' },
  mismatch:      { sev: 'check', title: 'Значки заменены не один к одному', why: 'Число значков до и после разное.' },
  changed:       { sev: 'check', title: 'Символ заменён другим символом', why: '' },
  glue:          { sev: 'info', title: 'Исправлена склейка заголовка и подписи', why: 'В оригинале заголовок и подпись строки шли подряд без пробела («Крышка-1223.07.2026»). В редизайне это две раздельные строки — так и должно быть.' },
  'trunc-fixed': { sev: 'info', title: 'Обрезка из оригинала устранена', why: '' },
};
const SEV_ORDER = { problem: 0, check: 1, info: 2 };
const SYN = [['📅', '📆', '🗓'], ['🔍', '🔎', '⌕'], ['✅', '✓', '☑', '✔'], ['⏳', '⌛'], ['🔄', '🔁'], ['⭐', '★'], ['🏆', '🥇'], ['✏', '📝'], ['📷', '📸'], ['📜', '📄', '📃']];
const synOf = (g) => { const i = SYN.findIndex((s) => s.includes(g)); return i < 0 ? g : 'syn' + i; };

function go(k) { location.hash = '#' + (k + 1); }

}
function showSummary() { cur = -1; $('#screen').hidden = true; $('#summary').hidden = false; markCurrent(); $('#main').scrollTop = 0; }
function showScreen(k) {

  isolate(dO, S.phO); isolate(dR, S.phR);
  $('#s-num').textContent = '№ ' + (k + 1); $('#s-name').textContent = S.name; $('#s-sec').textContent = S.sec; $('#s-rid').textContent = S.rid; $('#s-of').textContent = 'экран ' + (k + 1) + ' из ' + SCREENS.length;

$('#prev').onclick = () => cur > 0 && go(cur - 1);
